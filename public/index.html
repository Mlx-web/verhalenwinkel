<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonja's Verhalenwinkel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="admin-link" href="login.html">Beheer</a>
  </header>

  <div class="shop-sign-wrap">
    <div class="shop-sign">
      <h1>Sonja's Verhalenwinkel</h1>
      <p>Verhalen in de etalage, elk raam is een podium voor een verhaal.</p>
    </div>
  </div>

  <main>
    <section id="etalage" class="etalage" aria-label="Etalage met verhalen">
      <!-- Ramen worden hier via JavaScript ingevuld -->
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; Sonja's Verhalenwinkel — een oefenproject</p>
  </footer>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal-page" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" aria-label="Sluiten">&times;</button>
      <h2 id="modal-title"></h2>
      <p id="modal-author" class="modal-author" hidden></p>
      <div id="modal-body" class="modal-body"></div>
      <button id="modal-delete-story" class="comment-delete" type="button" hidden>Verwijder mijn verhaal</button>

      <div class="comments-section">
        <h3>Reacties</h3>
        <ul id="comments-list" class="comments-list"></ul>

        <form id="comment-form" class="comment-form">
          <input
            type="text"
            id="comment-name"
            placeholder="Jouw naam (optioneel)"
            maxlength="60"
          />
          <textarea
            id="comment-text"
            placeholder="Laat een reactie achter..."
            maxlength="500"
            rows="3"
            required
          ></textarea>
          <button type="submit" class="btn">Plaats reactie</button>
          <p id="comment-message" class="message error" hidden></p>
        </form>
      </div>
    </div>
  </div>

  <div id="mailbox-overlay" class="modal-overlay" hidden>
    <div class="modal-page" role="dialog" aria-modal="true" aria-labelledby="mailbox-title">
      <button id="mailbox-close" class="modal-close" aria-label="Sluiten">&times;</button>
      <h2 id="mailbox-title">Een briefje voor Sonja</h2>
      <p>Een verzoekje, compliment of opmerking — dit gaat rechtstreeks naar Sonja, niet openbaar op de site.</p>
      <form id="mailbox-form">
        <div class="field">
          <label for="mailbox-name">Jouw naam (optioneel)</label>
          <input type="text" id="mailbox-name" maxlength="60" />
        </div>
        <div class="field">
          <label for="mailbox-text">Bericht</label>
          <textarea id="mailbox-text" rows="5" maxlength="1000" required></textarea>
        </div>
        <button type="submit" class="btn">Versturen</button>
        <p id="mailbox-message" class="message" hidden></p>
      </form>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
