<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sonja's Verhalenwinkel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <a class="admin-link" href="login.html">Beheer</a>
  </header>

  <div class="shop-sign-wrap">
    <div class="shop-sign">
      <h1>Sonja's Verhalenwinkel</h1>
      <p>Verhalen in de etalage — kijk gerust naar binnen</p>
    </div>
  </div>

  <main>
    <section id="etalage" class="etalage" aria-label="Etalage met verhalen">
      <!-- Ramen worden hier via JavaScript ingevuld -->
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; Sonja's Verhalenwinkel — een oefenproject</p>
  </footer>

  <div id="modal-overlay" class="modal-overlay" hidden>
    <div class="modal-page" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button id="modal-close" class="modal-close" aria-label="Sluiten">&times;</button>
      <h2 id="modal-title"></h2>
      <div id="modal-body" class="modal-body"></div>

      <div class="comments-section">
        <h3>Reacties</h3>
        <ul id="comments-list" class="comments-list"></ul>

        <form id="comment-form" class="comment-form">
          <input
            type="text"
            id="comment-name"
            placeholder="Jouw naam (optioneel)"
            maxlength="60"
          />
          <textarea
            id="comment-text"
            placeholder="Laat een reactie achter..."
            maxlength="500"
            rows="3"
            required
          ></textarea>
          <button type="submit" class="btn">Plaats reactie</button>
          <p id="comment-message" class="message error" hidden></p>
        </form>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
