<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beheerder inloggen — Kris Kras Clubhuis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600;1,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="centered-page">
    <div class="panel">
      <a class="panel-back" href="index.html">&larr; Terug naar de etalage</a>
      <h1>Beheerder inloggen</h1>
      <p>Log in om nieuwe verhalen aan de etalage toe te voegen.</p>

      <form id="login-form">
        <div class="field">
          <label for="password">Wachtwoord</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn">Inloggen</button>
        <p id="login-message" class="message error" hidden></p>
      </form>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
