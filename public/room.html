<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achterkamertje — Sonja's Verhalenwinkel</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header room-header">
    <a class="admin-link" href="index.html">← Terug naar de etalage</a>
  </header>

  <div class="shop-sign-wrap">
    <div class="shop-sign">
      <h1>Het Achterkamertje</h1>
      <p>Hier schrijft Sonja haar verhalen</p>
    </div>
  </div>

  <main class="room-main">
    <div class="room">
      <div class="ceiling-beam"></div>
      <div class="lamps">
        <div class="lamp">
          <span class="lamp-cord"></span>
          <span class="lamp-shade"></span>
          <span class="lamp-glow"></span>
        </div>
        <div class="lamp">
          <span class="lamp-cord"></span>
          <span class="lamp-shade"></span>
          <span class="lamp-glow"></span>
        </div>
        <div class="lamp">
          <span class="lamp-cord"></span>
          <span class="lamp-shade"></span>
          <span class="lamp-glow"></span>
        </div>
      </div>

      <div class="room-floor">
        <div class="bookshelf" aria-hidden="true">
          <div class="bookshelf-row">
            <span class="book" style="height: 69px; background: var(--ochre);"></span>
            <span class="book" style="height: 84px; background: var(--sage-dark);"></span>
            <span class="book" style="height: 60px; background: var(--oxblood-dark);"></span>
            <span class="book" style="height: 78px; background: var(--sage);"></span>
            <span class="book" style="height: 66px; background: var(--ochre-light);"></span>
            <span class="book" style="height: 81px; background: var(--oxblood-light);"></span>
            <span class="book" style="height: 57px; background: var(--parchment-dark);"></span>
          </div>
          <div class="bookshelf-row">
            <span class="book" style="height: 57px; background: var(--sage);"></span>
            <span class="book" style="height: 75px; background: var(--ochre-light);"></span>
            <span class="book" style="height: 63px; background: var(--oxblood-light);"></span>
            <span class="book" style="height: 78px; background: var(--sage-dark);"></span>
            <span class="book" style="height: 54px; background: var(--ochre-dark);"></span>
            <span class="book" style="height: 72px; background: var(--parchment-dark);"></span>
            <span class="book" style="height: 66px; background: var(--sage-light);"></span>
          </div>
          <div class="bookshelf-row">
            <span class="book" style="height: 63px; background: var(--sage-light);"></span>
            <span class="book" style="height: 81px; background: var(--ochre-dark);"></span>
            <span class="book" style="height: 69px; background: var(--sage-dark);"></span>
            <span class="book" style="height: 54px; background: var(--parchment-dark);"></span>
            <span class="book" style="height: 78px; background: var(--oxblood);"></span>
            <span class="book" style="height: 66px; background: var(--ochre);"></span>
            <span class="book" style="height: 57px; background: var(--sage);"></span>
          </div>
        </div>

        <div class="room-column">
          <div class="room-wall">
            <div class="poster-frame"><span>Binnenkort: posters</span></div>
            <div class="poster-frame"><span>Binnenkort: posters</span></div>
            <div class="poster-frame"><span>Binnenkort: posters</span></div>
            <div class="wall-clock" aria-hidden="true">
              <div class="clock-face">
                <span class="clock-tick tick-12"></span>
                <span class="clock-tick tick-3"></span>
                <span class="clock-tick tick-6"></span>
                <span class="clock-tick tick-9"></span>
                <span class="clock-hand clock-hour" id="clock-hour"></span>
                <span class="clock-hand clock-minute" id="clock-minute"></span>
                <span class="clock-hand clock-second" id="clock-second"></span>
                <span class="clock-center"></span>
              </div>
            </div>
          </div>

          <div class="table-area">
            <div class="room-table">
              <button type="button" id="typewriter" class="typewriter" aria-label="Open de typemachine om een verhaal te typen">
                <span class="tw-paper"></span>
                <span class="tw-roller"></span>
                <span class="tw-lever"></span>
                <span class="tw-body">
                  <span class="tw-keys"></span>
                </span>
                <span class="tw-base"></span>
              </button>
              <div class="table-top"></div>
              <div class="table-leg left"></div>
              <div class="table-leg right"></div>
            </div>

            <svg class="room-cat" viewBox="0 0 100 100" aria-hidden="true">
              <path class="cat-tail" d="M 70 78 C 100 78, 101 40, 78 34 C 94 44, 92 68, 68 72 Z" />
              <ellipse class="cat-body" cx="46" cy="80" rx="28" ry="20" />
              <path class="cat-ear" d="M 26 26 L 32 4 L 42 24 Z" />
              <path class="cat-ear" d="M 46 24 L 56 4 L 62 26 Z" />
              <circle class="cat-head" cx="44" cy="40" r="22" />
              <circle class="cat-eye" cx="36" cy="38" r="2.6" />
              <circle class="cat-eye" cx="52" cy="38" r="2.6" />
              <path class="cat-nose" d="M 41 45 L 47 45 L 44 49 Z" />
            </svg>

            <p class="room-hint">Klik op de typemachine om een verhaal te typen</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; Sonja's Verhalenwinkel — een oefenproject</p>
  </footer>

  <div id="type-overlay" class="modal-overlay" hidden>
    <div class="modal-page" role="dialog" aria-modal="true" aria-labelledby="type-title">
      <button id="type-close" class="modal-close" aria-label="Sluiten">&times;</button>
      <h2 id="type-title">Typ een nieuw verhaal</h2>
      <form id="type-form">
        <div class="field">
          <label for="type-story-title">Titel</label>
          <input type="text" id="type-story-title" required />
        </div>
        <div class="field">
          <label for="type-story-author">Schrijver</label>
          <input type="text" id="type-story-author" />
        </div>
        <div class="field">
          <label for="type-story-text">Verhaal</label>
          <textarea id="type-story-text" class="typewriter-textarea" rows="14" required></textarea>
        </div>
        <button type="submit" class="btn">Opslaan in de etalage</button>
        <p id="type-message" class="message" hidden></p>
      </form>
    </div>
  </div>

  <script src="js/room.js"></script>
</body>
</html>
